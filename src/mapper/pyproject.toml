[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rafptor-mapper"
version = "0.1.0"
description = "Rafptor font mapper — AFP raster → TrueType automated matching"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Rafptor Team" }]
dependencies = [
    "pillow==10.3.0",
    "numpy==1.26.4",
    "fonttools==4.51.0",
    "freetype-py==2.4.0",
    "pymongo==4.7.2",
    "pydantic==2.7.1",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "hypothesis==6.152.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[project.scripts]
rafptor-mapper = "rafptor_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/rafptor_mapper"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers -ra"
