server:
  listen: ":2222"
  host_key: "/etc/rafptor/ssh_host_ed25519_key"
  authorized_keys_dir: "/etc/rafptor/authorized_keys/"
  upload_dir: "/data/uploads"
  max_bundle_size: "50GB"
  max_connections_per_client: 3
  rate_limit_per_minute: 100

crypto:
  encryption_key_source: "file"
  vault_addr: "https://vault.internal:8200"
  vault_path: "secret/data/rafptor/keys"
  key_rotation_days: 90
  file_keystore_path: "/etc/rafptor/keystore.enc"

transfer:
  chunk_size: "64KB"
  checkpoint_dir: "/data/checkpoints"

throttle:
  default_max_bytes_per_sec: 0
  business_hours:
    start: "08:00"
    end: "18:00"
    timezone: "Europe/Paris"
    max_bytes_per_sec: "10MB"

audit:
  log_path: "/var/log/rafptor/audit.jsonl"
  retention_days: 2555
  hmac_key_source: "env"

webhook:
  url: "https://api.rafptor.internal/v1/bundles/received"
  timeout: "30s"
  retry_count: 3
