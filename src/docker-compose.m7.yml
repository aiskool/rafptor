version: "3.9"

services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./api
    image: rafptor/api:dev
    environment:
      RAFPTOR_MONGODB_URI: mongodb://mongo:27017/rafptor
      RAFPTOR_JWT_SECRET: ${RAFPTOR_JWT_SECRET:-dev-change-me-minimum-32-bytes-long-xxxxxxxxxxxxxxx}
      RAFPTOR_CORS_ALLOWED_ORIGINS: http://localhost:4041
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  dashboard:
    build:
      context: ./dashboard
    image: rafptor/dashboard:dev
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: http://localhost:8080/ws
    ports:
      - "4041:8080"
    depends_on:
      - api

volumes:
  mongo_data:
