name: Security

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java, go, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem + IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  trivy-image:
    name: Trivy container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [transport, mapper, validator, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: src/${{ matrix.module }}
        run: docker build -t rafptor/${{ matrix.module }}:ci .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rafptor/${{ matrix.module }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: rafptor-sbom.cdx.json
