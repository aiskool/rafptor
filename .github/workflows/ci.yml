name: CI

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            java:
              - 'src/parser/**'
              - 'src/converter/**'
              - 'src/api/**'
            go:
              - 'src/transport/**'
            python:
              - 'src/mapper/**'
              - 'src/validator/**'
              - 'src/collector/**'
            node:
              - 'src/dashboard/**'

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    # Pin to 22.04: flapdoodle embed-mongo packageresolver 4.11.1 has no
    # rule for Ubuntu 24.04 yet. Bump once the resolver adds 24.04 support.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install parser
        working-directory: src/parser
        run: mvn -B -ntp install -DskipTests
      - name: Build & test parser
        working-directory: src/parser
        run: mvn -B -ntp verify
      - name: Build & test converter
        working-directory: src/converter
        run: mvn -B -ntp verify
      - name: Build & test api
        working-directory: src/api
        run: mvn -B -ntp verify

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/transport/go.sum
      - name: Vet
        working-directory: src/transport
        run: go vet ./...
      - name: Test
        working-directory: src/transport
        run: go test -race -coverprofile=coverage.out ./...

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [mapper, validator, collector]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/${{ matrix.module }}/requirements.txt
      - name: Install
        working-directory: src/${{ matrix.module }}
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        working-directory: src/${{ matrix.module }}
        run: ruff check src tests
      - name: Type-check
        working-directory: src/${{ matrix.module }}
        run: mypy src
      - name: Test
        working-directory: src/${{ matrix.module }}
        run: pytest

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json
      - name: Install
        working-directory: src/dashboard
        run: npm ci
      - name: Type-check
        working-directory: src/dashboard
        run: npm run typecheck
      - name: Lint
        working-directory: src/dashboard
        run: npm run lint
      - name: Build
        working-directory: src/dashboard
        run: npm run build

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden licenses in manifests
        run: |
          set -e
          if grep -rEi "(GPL-[23]\\.0|AGPL-3\\.0)" --include=pom.xml --include=go.mod --include=requirements.txt --include=package.json .; then
            echo "::error::Forbidden GPL/AGPL dependency declared in manifests"
            exit 1
          fi
